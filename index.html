<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tiramisuclub — Track My Order</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #FDF6EE; --blush: #F2D9D9; --rose: #C8737A; --rose-dark: #9E454B;
      --charcoal: #2B2B2B; --mid: #6B6363; --border: #E8D5D5;
    }
    body { background: var(--cream); font-family: 'DM Sans', sans-serif; color: var(--charcoal); min-height: 100vh; }
    header { background: white; border-bottom: 1px solid var(--border); padding: 18px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
    .logo-pill { background: var(--blush); color: var(--rose-dark); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
    header h1 { font-size: 15px; font-weight: 500; }
    main { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }
    .hero { text-align: center; margin-bottom: 36px; }
    .hero h2 { font-size: 28px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
    .hero p { font-size: 14px; color: var(--mid); font-weight: 300; }
    .search-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 32px; box-shadow: 0 2px 12px rgba(200,115,122,0.06); }
    .search-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); margin-bottom: 10px; display: block; }
    .search-row { display: flex; gap: 10px; }
    .search-row input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 14px; color: var(--charcoal); background: var(--cream); outline: none; transition: border-color 0.2s; }
    .search-row input:focus { border-color: var(--rose); }
    .search-row input::placeholder { color: #C9B8B8; }
    .search-btn { background: var(--rose); color: white; border: none; border-radius: 10px; padding: 12px 22px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .search-btn:hover { background: var(--rose-dark); }
    .results-section { margin-bottom: 32px; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .warehouse-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; }
    .badge-kr { background: #F2D9D9; color: var(--rose-dark); }
    .badge-ch { background: #D9EAF2; color: #2B6A9E; }
    .section-count { font-size: 12px; color: var(--mid); }
    .table-wrap { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #FAF2F2; border-bottom: 1px solid var(--border); }
    th { padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); }
    td { padding: 13px 16px; font-size: 13px; border-bottom: 1px solid #F5EDED; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FFFAFA; }
    .order-id { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--rose-dark); }
    .item-name { font-weight: 500; }
    .tracking-num { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--mid); }
    .ems-amount { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--charcoal); }
    .ems-paid { font-size: 14px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .status-secured   { background: #FFF3E0; color: #E07B00; }
    .status-otw       { background: #EDE7F6; color: #6A3DB8; }
    .status-shipped   { background: #E3F2FD; color: #1565C0; }
    .status-readyems  { background: #FFF8E1; color: #F57F17; }
    .status-emspaid   { background: #E8F5E9; color: #2E7D32; }
    .status-arrived   { background: #E8F5E9; color: #1B5E20; }
    .status-cancelled { background: #FFEBEE; color: #C62828; }
    .status-default   { background: #F5F5F5; color: #616161; }
    .not-found { background: white; border: 1px solid var(--border); border-radius: 14px; text-align: center; padding: 48px 20px; }
    .not-found .emoji { font-size: 36px; margin-bottom: 12px; }
    .not-found h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .not-found p { font-size: 13px; color: var(--mid); }
    .loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px; color: var(--mid); font-size: 14px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--rose); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 24px; font-size: 12px; color: #C9B8B8; }
    @media (max-width: 600px) {
      .hero h2 { font-size: 22px; }
      .search-row { flex-direction: column; }
      .search-btn { width: 100%; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
<header>
  <div class="logo-pill">tiramisuclub</div>
  <h1>Order Tracker</h1>
</header>
<main>
  <div class="hero">
    <h2>Track your order 🎀</h2>
    <p>Enter your Telegram username (without @) to see your orders</p>
  </div>
  <div class="search-card">
    <span class="search-label">Your username</span>
    <div class="search-row">
      <input type="text" id="usernameInput" placeholder="e.g. afiqahpikachu" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"/>
      <button class="search-btn" onclick="searchOrders()">Track →</button>
    </div>
  </div>
  <div id="results"></div>
</main>
<footer>made with 🎀 by tiramisuclub</footer>

<script>
  const SHEET_ID = '1qI5ECoJ7JVgXJxC2OhQPacD-wj_ztXycyD0-HLvQewA';

  // A=0, B=1, C=2, D=3, E=4, F=5, G=6, H=7, I=8, J=9, K=10, L=11, M=12, N=13, O=14, P=15, Q=16
  const COL = {
    orderID:   1,   // B
    username:  2,   // C
    item:      3,   // D
    tracking:  10,  // K - Local Tracking
    emsAmount: 13,  // N - EMS Amount
    status:    16,  // Q - STATUS
  };

  const DATA_START_ROW = 6; // data starts row 7 = index 6

  async function fetchSheet(tabName) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47, text.length - 2));
    return json.table.rows;
  }

  function getCell(row, index) {
    if (!row.c || !row.c[index] || row.c[index].v === null || row.c[index].v === undefined) return '';
    return String(row.c[index].v).trim();
  }

  function statusClass(status) {
    const s = status.toUpperCase();
    if (s.includes('ARRIVED'))        return 'status-arrived';
    if (s.includes('EMS PAID'))       return 'status-emspaid';
    if (s.includes('READY FOR EMS'))  return 'status-readyems';
    if (s.includes('SHIPPED'))        return 'status-shipped';
    if (s.includes('OTW'))            return 'status-otw';
    if (s.includes('CANCELLED'))      return 'status-cancelled';
    if (s.includes('SECURED'))        return 'status-secured';
    return 'status-default';
  }

  function formatEMS(amount, status) {
    if (!amount || amount === '0' || amount === 'RM0.00' || amount === '0.0') return '—';
    if (status.toUpperCase().includes('EMS PAID')) return '<span class="ems-paid">💕 Paid</span>';
    // Format as RM if not already
    const num = parseFloat(amount);
    if (!isNaN(num)) return `<span class="ems-amount">RM${num.toFixed(2)}</span>`;
    return `<span class="ems-amount">${amount}</span>`;
  }

  function buildTable(orders, warehouse) {
    if (orders.length === 0) return '';
    const badgeClass = warehouse === 'KR' ? 'badge-kr' : 'badge-ch';
    const warehouseLabel = warehouse === 'KR' ? '🇰🇷 Korea Warehouse' : '🇨🇳 China Warehouse';
    const rows = orders.map(o => `
      <tr>
        <td><span class="order-id">${o.orderID}</span></td>
        <td class="item-name">${o.item || '—'}</td>
        <td><span class="status ${statusClass(o.status)}">${o.status || 'SECURED'}</span></td>
        <td>${formatEMS(o.emsAmount, o.status)}</td>
        <td><span class="tracking-num">${o.tracking || '—'}</span></td>
      </tr>`).join('');
    return `
      <div class="results-section">
        <div class="section-header">
          <span class="warehouse-badge ${badgeClass}">${warehouseLabel}</span>
          <span class="section-count">${orders.length} order${orders.length > 1 ? 's' : ''}</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Item</th>
                <th>Status</th>
                <th>EMS</th>
                <th>Tracking</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  async function searchOrders() {
    const username = document.getElementById('usernameInput').value.trim().toLowerCase();
    const resultsDiv = document.getElementById('results');

    if (!username) {
      resultsDiv.innerHTML = `<div class="not-found"><div class="emoji">👆</div><h3>Enter your username first!</h3><p>Type your Telegram username above (without @)</p></div>`;
      return;
    }

    resultsDiv.innerHTML = `<div class="loading"><div class="spinner"></div> Looking up your orders...</div>`;

    try {
      const [krRows, chRows] = await Promise.all([fetchSheet('KR'), fetchSheet('CH')]);

      function filterOrders(rows) {
        return rows.slice(DATA_START_ROW).filter(row => {
          if (!row.c) return false;
          const user = getCell(row, COL.username).toLowerCase();
          const item = getCell(row, COL.item);
          return user === username && item !== '';
        }).map(row => ({
          orderID:   getCell(row, COL.orderID),
          item:      getCell(row, COL.item),
          status:    getCell(row, COL.status),
          tracking:  getCell(row, COL.tracking),
          emsAmount: getCell(row, COL.emsAmount),
        }));
      }

      const krOrders = filterOrders(krRows);
      const chOrders = filterOrders(chRows);

      if (krOrders.length + chOrders.length === 0) {
        resultsDiv.innerHTML = `<div class="not-found"><div class="emoji">🔍</div><h3>No orders found</h3><p>No orders found for <strong>${username}</strong>. Please check your username and try again!</p></div>`;
        return;
      }

      resultsDiv.innerHTML = buildTable(krOrders, 'KR') + buildTable(chOrders, 'CH');

    } catch (err) {
      resultsDiv.innerHTML = `<div class="not-found"><div class="emoji">⚠️</div><h3>Something went wrong</h3><p>Couldn't load order data. Please try again later.</p></div>`;
      console.error(err);
    }
  }

  document.getElementById('usernameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchOrders();
  });
</script>
</body>
</html>
